site_name: SCARLET
site_description: NeXus-native framework for SANS data reduction workflows.
site_url: https://hibouchen.github.io/scarlet/
repo_url: https://github.com/hibouchen/scarlet
repo_name: hibouchen/scarlet
exclude_docs: |
  ebauche.txt
  stitching_note/**

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Tutorial: tutorial.md
  - Use SCARLET:
      - Command line: cli.md
      - Data format: format.md
      - NeXus schemas: schemas.md
  - API reference: api.md
