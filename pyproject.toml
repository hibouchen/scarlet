[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarlet"
version = "0.2.4"
description = "NeXus-native, instrument-agnostic framework for SANS data reduction."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SCARLET Contributors" }]
dependencies = [
    "PySide6>=6.7",
    "PyYAML>=6.0",
    "h5py>=3.10",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scipp>=25.0",
    "silx>=2.0",
    "QtAwesome>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]

[project.scripts]
scarlet = "scarlet.cli:main"
scarlet-notebook = "scarlet.tutorial:main"
viewer = "scarlet.gui.scarlet_viewer:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scarlet*"]

[tool.setuptools.package-data]
"scarlet.schemas" = ["*.yaml", "*.yml", "README.md"]
"scarlet.notebooks" = ["*.ipynb"]
